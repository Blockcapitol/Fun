[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web3-revenue-agents"
version = "0.1.0"
description = "Three practical Web3 AI agents: alpha alerts, grant hunter, and yield ops"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
